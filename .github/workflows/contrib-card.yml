name: Update mjlab contributor card

on:
  schedule:
    - cron: "17 3 * * *" # daily, 12:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_REPO: mujocolab/mjlab
          CARD_LOGIN: ${{ github.repository_owner }}
        run: uv run scripts/contrib_card.py --out assets/mjlab-card.svg --theme both

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh mjlab contributor card"
          git push
