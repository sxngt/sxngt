name: Update contributor cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 12:17 KST
  workflow_dispatch:

permissions:
  contents: write

env:
  # owner/repo pairs to render a card for; output goes to assets/<repo>-card-*.svg
  CARD_REPOS: |
    mujocolab/mjlab
    kevinzakka/mink

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_LOGIN: ${{ github.repository_owner }}
        run: |
          for repo in $CARD_REPOS; do
            name=${repo#*/}
            uv run scripts/contrib_card.py --repo "$repo" --login "$CARD_LOGIN" --out "assets/${name}-card.svg" --theme both
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh contributor cards"
          git push
